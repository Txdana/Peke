[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "peke"
version = "0.3.0"
description = "Local-first open-source data extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "scrapling[fetchers]",
    "pydantic>=2",
    "pyyaml==6.0.3",
    "python-dotenv",
    "typer==0.27.3",
    "rich",
    "platformdirs",
    "mcp>=2.3,<3",
    "filelock",
    "huggingface-hub",
    "keyring",
    "httpx",
    "tomli_w",
    "tomli>=2.0; python_version < '3.11'",
    "packaging",
    # Bundled SearXNG upstream runtime requirements (kept in sync with
    # licenses/SEARXNG-REQUIREMENTS.txt for the Windows local service).
    "certifi==2026.10.19",
    "babel==2.18.0",
    "flask-babel==4.0.0",
    "flask==3.1.3",
    "jinja2==3.1.6",
    "lxml==6.1.3",
    "pygments==2.21.0",
    "python-dateutil==2.9.0.post0",
    "curl_cffi==0.16.3",
    "valkey==6.1.1",
    "markdown-it-py==4.2.0",
    "msgspec==0.22.0",
    "isodate==0.7.2",
    "whitenoise==6.12.0",
    "typing-extensions==4.16.0",
]

[project.optional-dependencies]
gui = ["PySide6"]
gpu = ["nvidia-ml-py", "psutil"]
dev = ["pytest", "pytest-mock", "pytest-qt", "ruff", "mypy"]
security = ["bandit[toml]", "pip-audit"]

[project.scripts]
peke = "peke.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/peke", "src/searx"]
include = ["src/peke/**", "src/searx/**"]

[tool.hatch.build.targets.wheel.force-include]
"licenses/SEARXNG-LICENSE" = "searx/SEARXNG-LICENSE"
"licenses/SEARXNG-REQUIREMENTS.txt" = "searx/SEARXNG-REQUIREMENTS.txt"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/searx"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"
warn_unused_ignores = true

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts/validate_release.py",
  "/scripts/validate_desktop_build.py",
  "/scripts/gui_smoke.py",
  "/profiles",
  "/README.md",
  "/LICENSE",
  "/NOTICE",
  "/THIRD_PARTY_NOTICES.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/install.sh",
  "/install.ps1",
  "/packaging/windows/Peke.spec",
  "/packaging/windows/Peke.iss",
  "/src/searx",
  "/licenses",
  "/vendor/searxng-master-source-archive.zip",
]

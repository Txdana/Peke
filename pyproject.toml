[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "peke"
version = "0.1.0"
description = "Local-first open-source data extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["scrapling[fetchers]", "llama-cpp-python", "pydantic>=2", "pyyaml", "python-dotenv", "typer", "rich", "platformdirs"]

[project.optional-dependencies]
gui = ["PySide6"]
gpu = ["nvidia-ml-py", "psutil"]
dev = ["pytest", "pytest-mock", "pytest-qt", "ruff", "mypy"]
security = ["bandit[toml]", "pip-audit"]

[project.scripts]
peke = "peke.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/peke"]
include = ["src/peke/gui/theme.qss", "src/peke/gui/assets/*.svg", "src/peke/gui/assets/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "skip"
warn_unused_ignores = true

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts/validate_release.py",
  "/profiles",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/install.sh",
  "/install.ps1",
]

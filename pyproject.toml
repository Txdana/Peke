[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "peke"
version = "0.1.0"
description = "Open-source desktop workbench that orchestrates REA, Scrapling, and llama.cpp into a data-extraction pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Peke Developers" }
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "scrapling",
    "llama-cpp-python",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pynvml>=11.5.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
gui = [
    "PySide6>=6.5.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
peke = "peke.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/peke"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "B008", "BLE001", "S110", "SIM113"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Human-readable label shown in CLI events.
name: Example JSONPlaceholder posts
# Target URL; use a permitted public endpoint or your own service.
url: https://jsonplaceholder.typicode.com/posts/1
# 'basic' uses Scrapling's HTTP Fetcher; 'stealthy' uses its browser fetcher.
fetcher: basic
# Optional request headers and query parameters.
headers:
  Accept: application/json
params: {}
# GET or POST. For POST, body is sent as JSON when provided.
method: GET
body: null
# Optional REA endpoint hints; REA is not required for Phase 1.
endpoints: []
# Built-in schema: Article, Product, or Listing; custom path.py:Model is supported.
schema_name: Article
# auto validates clean JSON directly and falls back to the LLM; api never calls the LLM.
mode: auto
# Page iteration is reserved for later; currently a single request is made.
max_pages: 1
# Optional dot-separated path to the record/list within a JSON response.
item_path: null

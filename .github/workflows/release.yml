name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      CMAKE_ARGS: "-DGGML_CUDA=OFF"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/peke/banner.py
      - name: Static security analysis
        run: bandit -q -r src/peke -ll
      - name: Dependency vulnerability audit
        run: pip-audit --strict --skip-editable
      - name: Test
        run: pytest -q

  installer-smoke:
    name: Installer syntax and dry-run (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: POSIX installer syntax and dry-run
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -n install.sh
          sh install.sh --dry-run
      - name: PowerShell installer parse and dry-run
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'install.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Error }
          ./install.ps1 -DryRun

  build:
    needs: [test, installer-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install build==1.2.2.post1 twine==6.1.0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - name: Resolve and export hash-locked runtime dependencies
        run: |
          uv lock
          mkdir -p release-assets
          uv export --locked --format requirements-txt --extra gui --no-dev --no-default-groups --no-emit-project --output-file release-assets/requirements-hashed.txt
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel and source distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tarfile import open as open_tar
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1, f"Expected one wheel, found {wheels}"
          assert len(sdists) == 1, f"Expected one sdist, found {sdists}"
          with ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
              assert "peke/gui/theme.qss" in names
              assert "peke/gui/assets/peke.svg" in names
              assert any(name.endswith("entry_points.txt") for name in names)
          with open_tar(sdists[0], "r:gz") as archive:
              names = set(archive.getnames())
              assert any(name.endswith("/install.sh") for name in names)
              assert any(name.endswith("/install.ps1") for name in names)
              assert any(name.endswith("/docs/installers.md") for name in names)
          PY
      - name: Smoke-install wheel without resolving dependencies
        run: |
          python -m venv /tmp/peke-wheel-smoke
          /tmp/peke-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          /tmp/peke-wheel-smoke/bin/python - <<'PY'
          from importlib.metadata import distribution
          from importlib.resources import files
          dist = distribution("peke")
          assert any(ep.name == "peke" and ep.value == "peke.cli:app" for ep in dist.entry_points)
          assert files("peke.gui").joinpath("theme.qss").is_file()
          assert files("peke.gui.assets").joinpath("peke.svg").is_file()
          print("Wheel install smoke test passed")
          PY
      - name: Create release assets and integrity manifest
        run: |
          mkdir -p release-assets
          cp dist/*.whl dist/*.tar.gz release-assets/
          (cd release-assets && sha256sum *.whl *.tar.gz requirements-hashed.txt) > release-assets/SHA256SUMS
          cat release-assets/SHA256SUMS
      - name: Validate release assets and tag version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            python scripts/validate_release.py --tag "$GITHUB_REF_NAME"
          else
            python scripts/validate_release.py
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: github-release-assets
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_TRUSTED_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/peke
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  github-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Extract changelog section
        shell: bash
        run: |
          awk '/^## \[/{if (seen) exit; seen=1; next} seen {print}' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "See CHANGELOG.md for release notes." > release-notes.md; fi
      - uses: actions/download-artifact@v4
        with:
          name: github-release-assets
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*

name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui,dev,security]"
      - name: Ruff
        run: ruff check .
      - name: Type check (focused, lenient)
        run: mypy src/peke/banner.py
      - name: Tests
        run: pytest -q
      - name: MCP Stdio Handshake Test
        run: peke mcp doctor

  gui-offscreen:
    name: GUI tests (offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[gui,dev,security]
      - name: Run GUI tests offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v tests/gui
      - name: Static security analysis
        run: bandit -q -r src/peke -ll
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable
      - name: Lint
        run: ruff check .
